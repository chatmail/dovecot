name: release

# Publish an already-built package to download.delta.chat and GitHub
# releases when an upstream/* tag is pushed. 
on:
  push:
    tags:
      - 'upstream/*'
  workflow_dispatch:
    inputs:
      run_id:
        description: >
          CI run_id to pull build-area artifacts from (e.g. for re-testing
          this workflow itself without a tag push); must be a completed,
          successful run.
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  # Resolve which ci run already built the tagged commit, so publish never
  # rebuilds (workflow_dispatch supplies inputs.run_id directly).
  find-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: find the CI run that built ${{ github.sha }}
        id: find
        run: |
          run_id=$(gh run list --repo "${{ github.repository }}" \
            --workflow ci --commit "${{ github.sha }}" --status success \
            --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::No successful CI run found for commit ${{ github.sha }}" \
                 "(tag ${{ github.ref_name }}). CI only builds on master pushes and PRs," \
                 "push this commit to master first, then re-tag, " \
                 "or use this workflow's own workflow_dispatch run_id input" \
                 "once a build exists." >&2
            exit 1
          fi
          echo "Found CI run $run_id for ${{ github.sha }}"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [find-build]
    # needs.find-build is skipped (not failed) on workflow_dispatch, avoid that
    # this job would be skipped too:
    if: |
      always() && (github.event_name == 'workflow_dispatch' || needs.find-build.result == 'success')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: bookworm, arch: amd64 }
          - { distro: bookworm, arch: arm64 }
          - { distro: trixie,   arch: amd64 }
          - { distro: trixie,   arch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false

      - name: download built packages
        uses: actions/download-artifact@v8
        with:
          name: build-area-${{ matrix.distro }}-${{ matrix.arch }}
          path: build-area
          run-id: ${{ needs.find-build.outputs.run_id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: upload .deb files to download.delta.chat
        run: |
          mkdir -p "$HOME/.ssh"
          echo "${{ secrets.KEY }}" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          # dpkg-parsechangelog expects debian/changelog format, not the RFC822
          # control-stanza format .dsc files use -- read the Version field directly.
          version=$(grep -m1 '^Version:' build-area/dovecot_*.dsc | awk '{print $2}' | sed 's/^1://')
          # 4 matrix jobs race to rsync into the same remote dir via rrsync,
          # which only lets one instance in at a time. Give contending jobs
          # generous room to queue up rather than risk failing out a 45min
          # build over a lock that just needs to clear.
          for attempt in 1 2 3 4 5 6; do
            if rsync -Lvh --mkpath \
                -e "ssh -i $HOME/.ssh/key -o StrictHostKeyChecking=no" \
                "$GITHUB_WORKSPACE"/build-area/dovecot-core_*.deb \
                "$GITHUB_WORKSPACE"/build-area/dovecot-imapd_*.deb \
                "$GITHUB_WORKSPACE"/build-area/dovecot-lmtpd_*.deb \
                "$GITHUB_WORKSPACE"/build-area/dovecot_*.dsc \
                "$GITHUB_WORKSPACE"/build-area/dovecot_*.tar.* \
                "$GITHUB_WORKSPACE"/build-area/*.changes \
                "$GITHUB_WORKSPACE"/build-area/*.buildinfo \
                "${{ secrets.USERNAME }}@download.delta.chat:${{ matrix.distro }}/${version}/"; then
              exit 0
            fi
            echo "rsync attempt $attempt failed (rrsync dir busy?), retrying in 30s..."
            sleep 30
          done
          echo "rsync failed after 6 attempts" >&2
          exit 1

      - name: upload to github release
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends gh
          version=$(grep -m1 '^Version:' build-area/dovecot_*.dsc | awk '{print $2}' | sed 's/^1://')
          # The build stamps a distro-distinct version onto the changelog
          # (+deb12u1 / +deb13u1). The GitHub release itself
          # stays combined across the matrix, keyed on the neutral base
          # version with that stamp stripped back off.
          base_version=$(echo "$version" | sed -E 's/\+deb[0-9]+u[0-9]+$//')
          tag="upstream/${base_version}"
          gh release create "$tag" --title "$tag" || true
          gh release upload "$tag" --clobber \
            build-area/dovecot-core_*.deb \
            build-area/dovecot-imapd_*.deb \
            build-area/dovecot-lmtpd_*.deb \
            build-area/dovecot_*.buildinfo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The changelog is stamped per-distro before the build so the source
      # package differs and must be uploaded once per distro. Arch doesn't
      # affect the source, so only one arch per distro uploads it.
      - name: upload source to github release
        if: matrix.arch == 'amd64'
        run: |
          version=$(grep -m1 '^Version:' build-area/dovecot_*.dsc | awk '{print $2}' | sed 's/^1://')
          base_version=$(echo "$version" | sed -E 's/\+deb[0-9]+u[0-9]+$//')
          tag="upstream/${base_version}"
          gh release upload "$tag" --clobber \
            build-area/dovecot_*.dsc \
            build-area/dovecot_*.orig.tar.* \
            build-area/dovecot_*.debian.tar.*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
